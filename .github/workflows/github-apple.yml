# Required secrets:
#   GH_PAT  - GitHub PAT to download artifacts and create releases

name: GitHub Release (Apple)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'MobileCelestia build run ID (leave empty for latest)'
        required: false
      branch:
        description: 'Branch'
        required: true
        default: 'develop'

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Resolve Run ID
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          BUILD_BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID=$(gh api "repos/celestiamobile/MobileCelestia/actions/workflows/build.yml/runs?branch=$BUILD_BRANCH&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "No valid build run ID found" >&2; exit 1; }
          BUILD_COMMIT=$(gh api "repos/celestiamobile/MobileCelestia/actions/runs/$RUN_ID" --jq '.head_sha')
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid build commit" >&2; exit 1; }
          echo "RESOLVED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_ENV"

      - name: Download macOS Sideload Build
        uses: actions/download-artifact@v4
        with:
          name: macosx-developerID-angle-product
          run-id: ${{ env.RESOLVED_RUN_ID }}
          repository: celestiamobile/MobileCelestia
          github-token: ${{ secrets.GH_PAT }}
          path: '${{ runner.temp }}/artifacts'

      - name: Set Version
        run: |
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/celestiamobile/MobileCelestia/$BUILD_COMMIT/MobileCelestia.xcodeproj/project.xcproj" \
            --output "$RUNNER_TEMP/project.xcproj"
          VERSION=$(python3 - "$RUNNER_TEMP/project.xcproj" <<'PY'
          import pathlib
          import re
          import sys

          project = pathlib.Path(sys.argv[1]).read_text()
          versions = re.findall(r'"SHARED_BUILD_VERSION"\s*:\s*"([^"]+)"', project)
          if len(versions) != 1 or re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', versions[0]) is None:
              sys.exit("Expected one dotted SHARED_BUILD_VERSION in project.xcproj")
          print(versions[0])
          PY
          )
          git check-ref-format "refs/tags/$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rename File
        run: |
          : "${VERSION:?Release version is required}"
          mv "$RUNNER_TEMP/artifacts/App.zip" "$RUNNER_TEMP/Celestia_${VERSION}_macOS.zip"

      - name: Update Release Notes
        run: |
          CELESTIA_REPO_COMMIT=$(git ls-remote https://github.com/celestiamobile/Celestia ${{ inputs.branch }} | cut -f 1)
          CELESTIA_LOCALIZATION_REPO_COMMIT=$(git ls-remote https://github.com/celestiamobile/CelestiaLocalization ${{ inputs.branch }} | cut -f 1)
          CELESTIA_CONTENT_REPO_COMMIT=$(curl -s "https://raw.githubusercontent.com/celestiamobile/CelestiaUWP/${{ inputs.branch }}/.github/workflows/build.yml" | awk -F"'" '/CONTENT_COMMIT_HASH/ {print $2}')
          echo https://github.com/celestiamobile/Celestia/commit/$CELESTIA_REPO_COMMIT >> release-notes-github-apple.txt
          echo https://github.com/celestiamobile/CelestiaLocalization/commit/$CELESTIA_LOCALIZATION_REPO_COMMIT >> release-notes-github-apple.txt
          echo https://github.com/CelestiaProject/CelestiaContent/commit/$CELESTIA_CONTENT_REPO_COMMIT >> release-notes-github-apple.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          : "${VERSION:?Release version is required}"
          : "${BUILD_COMMIT:?Build commit is required}"
          test -s "$RUNNER_TEMP/Celestia_${VERSION}_macOS.zip"
          gh release create "$VERSION" \
            --repo celestiamobile/MobileCelestia \
            --target "$BUILD_COMMIT" \
            --title "$VERSION" \
            --notes-file release-notes-github-apple.txt \
            --draft \
            "$RUNNER_TEMP/Celestia_${VERSION}_macOS.zip"
